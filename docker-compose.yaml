services:
  ntfy:
    build: ./ntfy

    image: ntfy-server-rm

    container_name: ntfy-server-rm

    command:
      - serve

    ports:
      - 9980:80
     
    volumes:
      - persistence_ntfy_cache_rm:/var/cache/ntfy
      - persistence_ntfy_etc_rm:/etc/ntfy
    
    networks:
      - app_network
 
    restart: unless-stopped

    healthcheck: 
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:9980/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s




volumes:
  persistence_ntfy_cache_rm:
  persistence_ntfy_etc_rm:




networks:
  app_network:
    external: true